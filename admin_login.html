<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kidskart Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6fa5,#ffb6c1);
}

.login-box{
    width:400px;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

.logo{
    font-size:40px;
    margin-bottom:10px;
}

h1{
    color:#ff4f81;
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#ff4f81;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#ff4f81;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#e63d72;
}

#error{
    color:red;
    margin-top:15px;
    font-weight:bold;
}

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#ff4f81;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🧸</div>

    <h1>kidskart</h1>

    <p class="subtitle">
        Admin Dashboard Login
    </p>
<input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="loginAdmin()">
        Login
    </button>

    <div id="error"></div>

    <a href="dashboard.php" class="back">
        ← Back to Dashboard
    </a>

</div> 
<script>

function loginAdmin(){

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    let validEmail = "sujitha@kidskart.com";

    if(email === validEmail &&
       password === "kidskart123"){

        // Clear fields
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

        window.location.href = "admin.html";

    }else{

        document.getElementById("error").innerHTML =
        "❌ Invalid Email or Password";

        // Clear fields after wrong login
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
    }
}

window.onload = function(){

    document.getElementById("email").value = "";
    document.getElementById("password").value = "";

};

</script>
 
</body>
</html>
