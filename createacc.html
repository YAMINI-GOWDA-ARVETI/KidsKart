<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BabyBloom Create Account</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* BODY */

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 20px;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;

    background:
    linear-gradient(
        rgba(255,105,180,0.25),
        rgba(255,182,193,0.25)
    ),
    url('https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?q=80&w=1400&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}
/* FLOATING BUBBLES */

.bubble{
  position:absolute;
  bottom:-120px;
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(5px);
  animation:float 18s infinite ease-in;
}

.bubble:nth-child(1){
  width:90px;
  height:90px;
  left:8%;
  animation-duration:14s;
}

.bubble:nth-child(2){
  width:60px;
  height:60px;
  left:22%;
  animation-duration:12s;
  animation-delay:2s;
}

.bubble:nth-child(3){
  width:120px;
  height:120px;
  left:42%;
  animation-duration:18s;
}

.bubble:nth-child(4){
  width:70px;
  height:70px;
  left:65%;
  animation-duration:15s;
  animation-delay:1s;
}

.bubble:nth-child(5){
  width:100px;
  height:100px;
  left:82%;
  animation-duration:16s;
}

/* FLOAT ANIMATION */

@keyframes float{

  0%{
    transform:translateY(0) scale(1);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:translateY(-110vh) scale(1.3);
    opacity:0;
  }
}

/* REGISTER CARD */

.container{

    width:100%;
    max-width:500px;

    margin:30px auto;

    padding:35px;

    border-radius:25px;

    background:rgba(255,255,255,0.25);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.35);

    box-shadow:0 10px 35px rgba(0,0,0,.2);

    z-index:10;
}
/* LOGO */

.logo{
  text-align:center;
  font-size:55px;
  margin-bottom:10px;
}

/* HEADING */

h2{
  text-align:center;
  color:#ff4f81;
  margin-bottom:8px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#333;
  margin-bottom:25px;
  font-size:14px;
}

/* INPUTS */

.input-group{
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:6px;
  color:#333;
  font-weight:500;
}

input,
select,
textarea{

    width:100%;
    padding:14px;

    border:none;
    border-radius:12px;

    background:rgba(255,255,255,.95);

    font-size:15px;

    margin-top:5px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    box-shadow:0 0 8px rgba(0,123,255,0.5);
}
/* PASSWORD STRENGTH */

.strength{
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
}

/* BUTTON */

button{
  width:100%;
  padding:14px;

  border:none;
  border-radius:14px;

  background:linear-gradient(
  135deg,
 #ff4fa3,
 #ff85c1,
 #ffc1e3
 );
  color:white;
  font-size:16px;
  font-weight:bold;

  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,123,255,0.4);
}

/* LOGIN LINK */

.login-link{
  text-align:center;
  margin-top:18px;
  color:#333;
}

.login-link a{
  color:#ff4fa3;
  text-decoration:none;
  font-weight:bold;
}

.login-link a:hover{
  text-decoration:underline;
}

/* MESSAGE */

.message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.success{
  color:green;
}

.error{
  color:red;
}

.warning{
  color:orange;
}

@media(max-width:768px){

.container{

    width:95%;
    padding:25px;
}

.logo{
    font-size:45px;
}

h2{
    font-size:28px;
}

.subtitle{
    font-size:13px;
}

button{
    padding:13px;
}

}

</style>
</head>

<body>

<!-- FLOATING BUBBLES -->

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<!-- REGISTER CARD -->

<div class="container">

  <div class="logo">🧸</div>

  <h2>Create Account</h2>

  <p class="subtitle">
    Join KidsKart for adorable baby products
  </p>

  <!-- FORM -->

  <form id="registerForm" action="register.php" method="POST">

    <div class="input-group">
      <label>First Name</label>
      <input type="text"
      id="firstName"
      placeholder="Enter first name"
      required>
    </div>

    <div class="input-group">
      <label>Last Name</label>
      <input type="text"
      id="lastName"
      placeholder="Enter last name"
      required>
    </div>

    <div class="input-group">
      <label>Phone Number</label>
      <input
type="tel"
id="phone"
placeholder="Enter 10-digit phone number"
maxlength="10"
pattern="[0-9]{10}"
required>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <input type="email"
      id="email"
      placeholder="Enter email"
      required>
    </div>

    <div class="input-group">
    <label>Address</label>
    <textarea
        id="address"
        placeholder="Enter your address"
        rows="3"
        required>
    </textarea>
</div>
    <div class="input-group">
  <label>Role</label>
  <select id="role" required>
    <option value="">Select Role</option>
    <option value="admin">Admin</option>
    <option value="team_member">Team Member</option>
    <option value="user">User</option>
  </select>
</div>

    <div class="input-group">
      <label>Password</label>
      <input type="password"
      id="password"
      placeholder="Enter strong password"
      required>

      <div class="strength"
      id="strengthText"></div>
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password"
      id="confirmPassword"
      placeholder="Confirm password"
      required>
    </div>

    <button type="submit">
      Create Account
    </button>

    <div class="message"
    id="message"></div>

  </form>

  <div class="login-link">
    Already have an account?
    <a href="register.html">
      Login
    </a>
  </div>

</div>
<script>

/* ELEMENTS */

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const phoneInput =
document.getElementById("phone");

const strengthText =
document.getElementById("strengthText");

const message =
document.getElementById("message");

/* PHONE NUMBER VALIDATION */

phoneInput.addEventListener("input", function(){

  this.value =
  this.value.replace(/\D/g,"");

  if(this.value.length > 10){

    this.value =
    this.value.slice(0,10);

  }

});

/* PASSWORD STRENGTH */

passwordInput.addEventListener("input", ()=>{

  const password =
  passwordInput.value;

  const strongRegex =
  /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

  const mediumRegex =
  /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;

  if(password.length === 0){

    strengthText.innerHTML = "";

  }

  else if(strongRegex.test(password)){

    strengthText.innerHTML =
    "Strong Password ✅";

    strengthText.className =
    "strength success";

  }

  else if(mediumRegex.test(password)){

    strengthText.innerHTML =
    "Medium Password ⚠️";

    strengthText.className =
    "strength warning";

  }

  else{

    strengthText.innerHTML =
    "Weak Password ❌";

    strengthText.className =
    "strength error";

  }

});

/* CONFIRM PASSWORD LIVE CHECK */

confirmPasswordInput.addEventListener("input", ()=>{

  const password =
  passwordInput.value;

  const confirmPassword =
  confirmPasswordInput.value;

  if(confirmPassword.length > 0){

    if(password === confirmPassword){

      message.innerHTML =
      "<span class='success'>✅ Passwords Match</span>";

    }

    else{

      message.innerHTML =
      "<span class='error'>❌ Passwords Do Not Match</span>";

    }

  }

  else{

    message.innerHTML = "";

  }

});

/* FORM SUBMIT */

document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        role: document.getElementById("role").value,
        password: document.getElementById("password").value
    };

    console.log(data); // check in browser console

    try {
        const response = await fetch("register.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        console.log(result);

        if (result.status === "success") {
            document.getElementById("message").innerHTML =
                "<span style='color:green'>✅ Account Created Successfully</span>";

            setTimeout(() => {
                window.location.href = result.redirect;
            }, 2000);

        } else {
            document.getElementById("message").innerHTML =
                "<span style='color:red'>❌ " + result.message + "</span>";
        }

    } catch (error) {
        console.log("ERROR:", error);

        document.getElementById("message").innerHTML =
            "<span style='color:red'>❌ Server Error</span>";
    }
});
</script>

</body>
</html>
