<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BabyBloom Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;

      background:
      linear-gradient(rgba(255,255,255,0.55),
      rgba(255,255,255,0.55)),
      url('https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?q=80&w=1400&auto=format&fit=crop');

      background-size:cover;
      background-position:center;
    }

    /* Floating bubbles */

    .bubble{
      position:absolute;
      bottom:100px;
      border-radius:50%;
      background:rgba(255,255,255,0.35);
      backdrop-filter:blur(4px);
      animation:float 18s infinite ease-in;
    }

    .bubble:nth-child(1){
      width:90px;
      height:90px;
      left:10%;
      animation-duration:15s;
    }

    .bubble:nth-child(2){
      width:60px;
      height:60px;
      left:25%;
      animation-duration:12s;
      animation-delay:2s;
    }

    .bubble:nth-child(3){
      width:120px;
      height:120px;
      left:45%;
      animation-duration:18s;
    }

    .bubble:nth-child(4){
      width:70px;
      height:70px;
      left:65%;
      animation-duration:14s;
      animation-delay:1s;
    }

    .bubble:nth-child(5){
      width:100px;
      height:100px;
      left:82%;
      animation-duration:16s;
    }

    @keyframes float{

      0%{
        transform:translateY(0) scale(1);
        opacity:0;
      }

      20%{
        opacity:1;
      }

      100%{
        transform:translateY(-110vh) scale(1.3);
        opacity:0;
      }
    }

    /* Login Card */

    .login-container{
      width:380px;
      padding:35px;
      border-radius:25px;

      background:rgba(255,255,255,0.25);

      backdrop-filter:blur(15px);

      border:1px solid rgba(255,255,255,0.3);

      box-shadow:0 8px 32px rgba(0,0,0,0.15);

      text-align:center;

      z-index:10;
    }

    .logo{
      font-size:55px;
      margin-bottom:10px;
    }

    h2{
      color:#ff4f81;
      font-size:32px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#555;
      font-size:14px;
      margin-bottom:25px;
    }

    .input-group{
      margin-bottom:18px;
      text-align:left;
    }

    .input-group label{
      display:block;
      margin-bottom:7px;
      color:#444;
      font-size:14px;
      font-weight:500;
    }

    input:not([type="checkbox"]){

      width:100%;
      padding:13px;

      border:none;
      border-radius:12px;

      background:rgba(255,255,255,0.8);

      font-size:15px;
    }

    input:not([type="checkbox"]):focus{
      outline:none;
      box-shadow:0 0 8px rgba(255,79,129,0.4);
    }

    /* Options */

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .remember{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      color:#444;
      cursor:pointer;
    }

    .remember input[type="checkbox"]{
      width:16px;
      height:16px;
      accent-color:#ff4f81;
      cursor:pointer;
    }

    .options a{
      text-decoration:none;
      color:#ff4f81;
      font-size:14px;
      font-weight:500;
    }

    .options a:hover{
      text-decoration:underline;
    }

    /* Button */

    .login-btn{
      width:100%;
      padding:13px;

      border:none;
      border-radius:14px;

      background:linear-gradient(to right, #ff7eb3, #ff758c);

      color:white;
      font-size:16px;
      font-weight:bold;

      cursor:pointer;

      transition:0.3s;
    }

    .login-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 15px rgba(255,117,140,0.4);
    }

    /* Register */

    .register{
      margin-top:22px;
      color:#444;
      font-size:14px;
    }

    .register a{
      color:#ff4f81;
      text-decoration:none;
      font-weight:bold;
    }

    .register a:hover{
      text-decoration:underline;
    }

  </style>
</head>

<body>

  <!-- Floating bubbles -->

  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <!-- Login Card -->

  <div class="login-container">

    <div class="logo">🧸</div>

    <h2>KidsKart</h2>

    <p class="subtitle">
      Cute & comfy baby products for your little one
    </p>

    <!-- FORM -->

    <form action="login.php" method="POST">

      <div class="input-group">

        <label>Email Address</label>

        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="input-group">

        <label>Password</label>

        <div style="position:relative;">

<input
type="password"
name="password"
id="password"
placeholder="Enter your password"
required
style="padding-right:45px;"
>


<span 
onclick="showPassword()"
style="
position:absolute;
right:15px;
top:13px;
cursor:pointer;
font-size:20px;
">

👁

</span>


</div>

      </div>
      <div class="input-group">

<label>Register As</label>

<select id="role" name="role" required
style="
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:rgba(255,255,255,0.8);
font-size:15px;
">
<option value="">Select Role</option>
<option value="admin">Admin</option>
<option value="team_member">Team Member</option>
<option value="user">User</option>
</select>

</div>

      <!-- Remember -->

      <div class="options">

        <label class="remember">

          <input type="checkbox">

          <span>Remember me</span>

        </label>

        <!-- Forgot password -->
<a href="forpass.html">
  Forgot Password?
</a>

      </div>

      <!-- Login button -->

      <button 
type="submit" 
class="login-btn">

Login

</button>
</form>

    <!-- Create account -->

    <div class="register">

      New here?

      <a href="createacc.html">
  Create Account
</a>

    </div>

  </div>

  <!-- JavaScript -->

 <script>
  function showPassword(){

let pass =
document.getElementById("password");


if(pass.type=="password")
{
pass.type="text";
}
else
{
pass.type="password";
}

}


</script>

</body>
</html>
